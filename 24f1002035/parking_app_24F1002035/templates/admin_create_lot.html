<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Parking Lot - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('admin_dashboard') }}">
                <i class="fas fa-car"></i> ParkEasy Admin
            </a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">Welcome, {{ session.username }}!</span>
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-tachometer-alt"></i> Admin Menu</h5>
                    </div>
                    <div class="list-group list-group-flush">
                        <a href="{{ url_for('admin_dashboard') }}" class="list-group-item list-group-item-action">
                            <i class="fas fa-home"></i> Dashboard
                        </a>
                        <a href="{{ url_for('admin_parking_lots') }}" class="list-group-item list-group-item-action">
                            <i class="fas fa-parking"></i> Parking Lots
                        </a>
                        <a href="{{ url_for('admin_create_lot') }}" class="list-group-item list-group-item-action active">
                            <i class="fas fa-plus"></i> Create Lot
                        </a>
                        <a href="{{ url_for('admin_users') }}" class="list-group-item list-group-item-action">
                            <i class="fas fa-users"></i> Users
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <div class="card">
                    <div class="card-header">
                        <h4><i class="fas fa-plus"></i> Create New Parking Lot</h4>
                    </div>
                    <div class="card-body">
                        {% with messages = get_flashed_messages() %}
                            {% if messages %}
                                {% for message in messages %}
                                    <div class="alert alert-warning alert-dismissible fade show" role="alert">
                                        {{ message }}
                                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                    </div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}

                        <form method="POST">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="location_name" class="form-label">Location Name *</label>
                                    <input type="text" class="form-control" id="location_name" name="location_name" 
                                           placeholder="e.g., Downtown Mall" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="pin_code" class="form-label">PIN Code *</label>
                                    <input type="text" class="form-control" id="pin_code" name="pin_code" 
                                           placeholder="e.g., 110001" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="address" class="form-label">Address *</label>
                                <textarea class="form-control" id="address" name="address" rows="3" 
                                          placeholder="Enter complete address" required></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="price_per_hour" class="form-label">Price per Hour (₹) *</label>
                                    <input type="number" class="form-control" id="price_per_hour" name="price_per_hour" 
                                           min="1" step="0.01" placeholder="50.00" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="max_spots" class="form-label">Maximum Parking Spots *</label>
                                    <input type="number" class="form-control" id="max_spots" name="max_spots" 
                                           min="1" max="1000" placeholder="20" required>
                                </div>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a href="{{ url_for('admin_parking_lots') }}" class="btn btn-secondary me-md-2">Cancel</a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> Create Parking Lot
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
